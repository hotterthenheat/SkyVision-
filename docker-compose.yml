services:
  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn skyvision.main:app --host 0.0.0.0 --port 8000
  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m skyvision.workers.realtime
  discord:
    build: .
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    command: python -m skyvision.workers.discord_bot
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyvision
      POSTGRES_USER: skyvision
      POSTGRES_PASSWORD: skyvision
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyvision -d skyvision"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
