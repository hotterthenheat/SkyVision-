[project]
name = "skyvision"
version = "0.1.0"
description = "Real-time options intelligence platform using Polygon, Tradier, and ThetaData."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "SQLAlchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "discord.py>=2.4.0",
  "python-json-logger>=2.0.7",
  "numpy>=2.0.0",
  "pandas>=2.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.8", "pytest-cov>=5.0.0", "respx>=0.21.1", "ruff>=0.5.5", "mypy>=1.11.1"]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyvision*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=skyvision --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["skyvision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
